plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gcmwatch'
    compileSdk 34

    defaultConfig {
        applicationId "com.gcmwatch"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // 不签名，只用 debug 包
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// 本项目不依赖任何第三方库，构建只需 AGP 本身
