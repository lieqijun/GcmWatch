plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gcmwatch'
    compileSdk 34

    defaultConfig {
        applicationId "com.gcmwatch"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
        // 只保留中文资源，去掉 AAPT 带入的其他语言
        resourceConfigurations += ['zh']
    }

    buildTypes {
        debug {
            // 用 R8 把 debug 包也压一遍：只保留真正用到的类，顺带删掉没引用的资源
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            // 不配置签名，只用 debug 包
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// 本项目不依赖任何第三方库，构建只需 AGP 本身
